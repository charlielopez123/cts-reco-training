[project]
name = "baselines-evaluation"
version = "0.1.0"
description = "Baseline evaluation framework for RTS Curator Recommendation System"
requires-python = ">=3.9,<3.13"
dependencies = [
    "cts-recommender",
    "pandas>=2.3.2",
    "numpy>=1.24.0",
    "tqdm>=4.67.1",
]

[tool.uv.sources]
cts-recommender = { workspace = true }

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
